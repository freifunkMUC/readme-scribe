name: Image

# Builds the image the action runs. A pull request and a push to master
# only build and test it; a tag v<version> publishes it as
# ghcr.io/freifunkmuc/readme-scribe:<version>, the name action.yml of that
# tag refers to.
on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for the runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: readme-scribe:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A template without calls to the GitHub API needs no token.
      - name: Render a template
        run: |
          docker run --rm -v "$PWD/test":/github/workspace -w /github/workspace \
            readme-scribe:test -write static.md static.md.tpl
          test "$(cat test/static.md)" = "Rendered by markscribe."

      - name: The tag matches action.yml
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -q "readme-scribe:${GITHUB_REF_NAME#v}\"" action.yml

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/freifunkmuc/readme-scribe
          tags: |
            type=semver,pattern={{version}}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
